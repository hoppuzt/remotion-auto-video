name: Render Remotion Video

on:
  # Terpicu otomatis saat input.json di-commit (alur Claude -> GitHub -> render).
  push:
    paths:
      - "input.json"
  # Bisa juga dijalankan manual dari tab Actions.
  workflow_dispatch:

# contents: write dibutuhkan untuk meng-commit cache audio (public/audio) kembali ke repo.
permissions:
  contents: write

# Satu render pada satu waktu; run berikutnya menunggu supaya push cache audio tidak bentrok.
concurrency:
  group: render-video
  cancel-in-progress: false

jobs:
  render:
    # Dikunci ke versi tertentu supaya tidak ikut berpindah saat ubuntu-latest naik versi.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Voiceover & Captions
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/generate-voiceover.mjs input.json resolved.json

      - name: Commit New Audio Cache
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$(git status --porcelain -- public/audio)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/audio
            git commit -m "chore: cache voiceover audio"
            git pull --rebase origin "$REF_NAME"
            git push origin "HEAD:$REF_NAME"
          else
            echo "Tidak ada file audio baru."
          fi

      - name: Render Video via Remotion
        run: npx remotion render src/index.ts my-video out/video.mp4 --props=resolved.json

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v7
        with:
          name: finished-video
          path: out/video.mp4

      # Link langsung ke MP4 (bisa dibuka di HP tanpa unzip), tersimpan di tab Releases.
      - name: Publish Video to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: video-${{ github.run_number }}
        run: |
          gh release create "$TAG" out/video.mp4 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "Video #${{ github.run_number }}" \
            --notes "Dirender otomatis dari input.json (run #${{ github.run_number }}, commit ${GITHUB_SHA::7})."
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/video.mp4"
          echo "Video: $URL"
          {
            echo "### Video siap"
            echo "[Buka / unduh video.mp4]($URL)"
            echo ""
            echo "Semua video: https://github.com/$GITHUB_REPOSITORY/releases"
          } >> "$GITHUB_STEP_SUMMARY"
