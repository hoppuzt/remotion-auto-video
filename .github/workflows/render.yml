name: Render Remotion Video

on:
  # Terpicu otomatis saat input.json di-commit (alur Claude -> GitHub -> render).
  push:
    paths:
      - "input.json"
  # Bisa juga dijalankan manual dari tab Actions.
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Render Video via Remotion
        run: npx remotion render src/index.ts my-video out/video.mp4 --props=input.json

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finished-video
          path: out/video.mp4
