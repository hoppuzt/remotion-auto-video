name: Render Remotion Video
on:
  repository_dispatch:
    types: [trigger-video-render]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-on-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Create Data Input File
        run: echo '${{ github.event.client_payload.video_data }}' > input.json

      - name: Render Video via Remotion
        run: npx remotion render src/index.ts my-video --props=input.json out/video.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finished-video
          path: out/video.mp4
          
